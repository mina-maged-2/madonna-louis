<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card - Madonna Louis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --border-color: #e2d7c3;
            --text-primary: #2a241e;
            --text-secondary: #6e6557;
            --gold-primary: #c29235;
            --gold-dark: #8a611c;
            --gold-light: #f4ece1;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(194, 146, 53, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(138, 97, 28, 0.1) 0px, transparent 50%);
        }

        .vcard-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 12px 30px rgba(138, 97, 28, 0.12);
        }

        /* Company Logo Header */
        .company-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .company-logo {
            max-width: 190px;
            height: auto;
            margin: 0 auto 4px auto;
            display: block;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 20px;
        }
